[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorizer"
version = "0.1.0"
description = "Raster-to-SVG architectural drawing vectorizer"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "numpy>=1.26",
    "scipy>=1.12",
    "skan>=0.11",
    "networkx>=3.2",
    "shapely>=2.0",
    "svgwrite>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "celery[redis]>=5.3",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "python-multipart>=0.0.9",
    "lxml>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
vectorize = "scripts.vectorize_cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["vectorizer*", "api*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
